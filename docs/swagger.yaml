info:
  contact:
    name: Roy Situmorang
  description: Back-office API of the Lestari point of sale. Every response uses the
    same envelope; lists put a page of rows in data, errors put a code (and field
    messages) there.
  title: Lestari API
  version: 0.1.0
paths:
  /branch-products:
    get:
      description: The products of every branch of the store with the prices each
        branch sells them at. Needs the business plugin.
      parameters:
      - description: search in product_name, sku
        in: query
        name: q
        type: string
      - description: only products of this branch
        in: query
        name: branch_id
        type: string
      - description: only products of this category
        in: query
        name: category_id
        type: string
      - description: sort field
        enum:
        - branch_id
        - branch_name
        - product_name
        - sku
        - category_id
        - stock
        - selling_price
        - purchase_price
        - is_available
        - created_at
        - updated_at
        in: query
        name: sort
        type: string
      - default: asc
        description: sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - default: 1
        description: page, from 1
        in: query
        name: page
        type: integer
      - default: 25
        description: rows per page
        in: query
        maximum: 1000
        name: per_page
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/helper.Pagination'
                  - properties:
                      rows:
                        items:
                          $ref: '#/definitions/models.BranchProduct'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "402":
          description: Payment Required
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: List branch products
      tags:
      - Branch products
  /branch-products/{id}:
    put:
      description: Changes the prices or availability of a product in its branch.
        Only the attributes present in the body are changed. When no value differs
        from the stored one nothing is written and updated_at stays as it was.
      parameters:
      - description: product id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: attributes to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BranchProductRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.BranchProduct'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "402":
          description: Payment Required
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Update a branch product
      tags:
      - Branch products
  /branch-products/export:
    get:
      description: The rows of the list (same filters and sorting, up to 50,000) as
        a file.
      parameters:
      - default: xlsx
        description: file format
        enum:
        - xlsx
        - csv
        - pdf
        in: query
        name: format
        type: string
      - description: search in product_name, sku
        in: query
        name: q
        type: string
      - description: only products of this branch
        in: query
        name: branch_id
        type: string
      - description: only products of this category
        in: query
        name: category_id
        type: string
      - description: sort field
        enum:
        - branch_id
        - branch_name
        - product_name
        - sku
        - category_id
        - stock
        - selling_price
        - purchase_price
        - is_available
        - created_at
        - updated_at
        in: query
        name: sort
        type: string
      - default: asc
        description: sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - text/csv
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "402":
          description: Payment Required
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Export branch products
      tags:
      - Branch products
  /branch-products/sync-prices:
    post:
      description: Sets the selling price of the products of the chosen branches to
        the price of the matching head-office product (the product it was copied from,
        or the one with the same SKU). Products that already have that price are left
        alone.
      parameters:
      - description: branches and, optionally, products
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BranchPriceSyncRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.UpdatedResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "402":
          description: Payment Required
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Copy head-office prices to branches
      tags:
      - Branch products
  /cash-drawers:
    get:
      description: Cash drawers of the active branch.
      parameters:
      - description: search in name
        in: query
        name: q
        type: string
      - description: sort field
        enum:
        - name
        - is_active
        - current_shift_status
        - created_at
        - updated_at
        in: query
        name: sort
        type: string
      - default: asc
        description: sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - default: 1
        description: page, from 1
        in: query
        name: page
        type: integer
      - default: 25
        description: rows per page
        in: query
        maximum: 1000
        name: per_page
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/helper.Pagination'
                  - properties:
                      rows:
                        items:
                          $ref: '#/definitions/models.CashDrawer'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: List cash drawers
      tags:
      - Cash drawers
    post:
      parameters:
      - description: cash drawer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CashDrawerRequest'
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.CashDrawer'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Create a cash drawer
      tags:
