info:
  contact:
    name: Roy Situmorang
  description: Back-office API of the Lestari point of sale. Every response uses the
    same envelope; lists put a page of rows in data, errors put a code (and field
    messages) there.
  title: Lestari API
  version: 0.1.0
paths:
  /account/activity-logs:
    get:
      parameters:
      - default: 1
        description: page, from 1
        in: query
        name: page
        type: integer
      - default: 50
        description: rows per page
        in: query
        maximum: 1000
        name: per_page
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/helper.Pagination'
                  - properties:
                      rows:
                        items:
                          $ref: '#/definitions/models.Activity'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: List my activity
      tags:
      - Account
  /account/deactivation-requests:
    post:
      description: Only the owner can ask for the store to be closed; the request
        is handled by Lestari support.
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.DeactivationRequest'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Request account deactivation
      tags:
      - Account
  /account/phone-verification:
    post:
      description: Sends a six-digit code to the number by WhatsApp or SMS. One code
        a minute; a code is valid for five minutes.
      parameters:
      - description: phone number
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PhoneVerificationRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.OTPSentResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "429":
          description: Too Many Requests
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Send a phone verification code
      tags:
      - Account
  /account/phone-verification/confirm:
    post:
      parameters:
      - description: phone number and code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PhoneConfirmationRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.PhoneVerifiedResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Confirm a phone verification code
      tags:
      - Account
  /account/ppob-pin:
    put:
      description: The PIN (6 digits) confirms PPOB sales in the cashier app. The
        account password travels base64-encoded.
      parameters:
      - description: password and new PIN
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PPOBPinRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.ChangedResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Change my PPOB PIN
      tags:
      - Account
  /account/profile:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Profile'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Get my profile
      tags:
      - Account
    put:
      description: Replaces the editable attributes. A changed phone number has to
        be verified again. When no value differs from the stored one nothing is written.
      parameters:
      - description: profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ProfileRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Profile'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Update my profile
      tags:
      - Account
  /account/two-factor/disable:
    post:
      description: Needs the account password (base64).
      parameters:
      - description: password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PasswordConfirmRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.TwoFactorResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Turn off two-step verification
      tags:
      - Account
  /account/two-factor/enable:
    post:
      description: Confirms the setup with a code of the authenticator app and returns
        eight recovery codes, shown only this once.
      parameters:
      - description: authenticator code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CodeRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.TwoFactorResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Turn on two-step verification
      tags:
      - Account
  /account/two-factor/setup:
    post:
      description: Returns a secret to add to an authenticator app (as text, as an
        otpauth URL and as a QR code). It takes effect once POST /account/two-factor/enable
        confirms a code.
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.TwoFactorSetup'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Start two-step verification
      tags:
      - Account
  /auth/login:
    post:
      description: 'Returns an access token (send it as "Authorization: Bearer …")
        and a refresh token. The password travels base64-encoded. With two-step verification
        on, a first attempt without otp answers 401 two_factor_required.'
      parameters:
      - description: credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Session'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Sign in
      tags:
      - Auth
  /auth/logout:
    post:
      description: 'Ends every session of the signed-in user: all their refresh tokens
        stop working.'
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: Sign out
      tags:
      - Auth
  /auth/me:
    get:
      description: The user with their store, active plugins and the branch they work
        in (X-Branch-Id, or their own).
      responses:
        "200":
