    same envelope; lists put a page of rows in data, errors put a code (and field
    messages) there.
  title: Lestari API
  version: 0.1.0
paths:
  /cash-drawers:
    get:
      description: Cash drawers of the active branch.
      parameters:
      - description: search in name
        in: query
        name: q
        type: string
      - description: sort field
        enum:
        - name
        - is_active
        - current_shift_status
        - created_at
        - updated_at
        in: query
        name: sort
        type: string
      - default: asc
        description: sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - default: 1
        description: page, from 1
        in: query
        name: page
        type: integer
      - default: 25
        description: rows per page
        in: query
        maximum: 1000
        name: per_page
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/helper.Pagination'
                  - properties:
                      rows:
                        items:
                          $ref: '#/definitions/models.CashDrawer'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/helper.ErrorData'
              type: object
      summary: List cash drawers
      tags:
      - Cash drawers
    post:
      parameters:
      - description: cash drawer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CashDrawerRequest'
      responses:
